name: Alchemy

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      adopt:
        description: Adopt the existing production Worker once
        type: boolean
        default: false
      plan_only:
        description: Review the production plan without deploying
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: alchemy-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
  queue: max
  cancel-in-progress: false

env:
  STAGE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'prod' }}

jobs:
  deploy:
    if: >-
      github.event.action != 'closed' &&
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository ||
      github.event_name != 'pull_request' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Check that the checkout is the branch head
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          head=$(git -c "http.extraheader=AUTHORIZATION: basic $auth" ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          if [ "$(git rev-parse HEAD)" != "$head" ]; then
            echo "::error::The checkout is not the branch head. Nothing was deployed."
            exit 1
          fi
      - run: npm run build
      - name: Plan production
        if: github.event_name != 'pull_request'
        run: |
          npx alchemy plan --env-file /dev/null --stage "$STAGE" --no-input $ADOPT | tee "$RUNNER_TEMP/alchemy-plan.log"
          if grep -Eq '\] (create|delete|replace|orphaned)( |$)' "$RUNNER_TEMP/alchemy-plan.log"; then
            echo "::error::Production plan creates, deletes, or replaces a resource. Stop and review."
            exit 1
          fi
          grep -Eq '\[Site\] (adopted|update|noop)( |$)' "$RUNNER_TEMP/alchemy-plan.log"
        env:
          ADOPT: ${{ inputs.adopt && '--adopt' || '' }}
          CONVEX_ACCESS_TOKEN: ${{ secrets.CONVEX_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        if: ${{ !inputs.plan_only }}
        run: npx alchemy deploy --env-file /dev/null --stage "$STAGE" --yes --no-input --detect-drift $ADOPT
        env:
          ADOPT: ${{ inputs.adopt && '--adopt' || '' }}
          CONVEX_ACCESS_TOKEN: ${{ secrets.CONVEX_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Update the stack comment
        if: github.event_name == 'pull_request'
        run: npx alchemy-convex stack-comment
        env:
          CONVEX_ACCESS_TOKEN: ${{ secrets.CONVEX_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

  destroy-preview:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Destroy only the PR stage
        run: |
          [[ "$STAGE" =~ ^pr-[0-9]+$ ]] || exit 1
          npx alchemy destroy --env-file /dev/null --stage "$STAGE" --yes --no-input
        env:
          CONVEX_ACCESS_TOKEN: ${{ secrets.CONVEX_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
